<script>
// Le motif du catalyseur n'existe pas encore quand cette page est
// fabriquee : le run du soir connait la DATE du depart (il la calcule) mais
// n'a ni modele ni acces web pour savoir ce qui s'est passe ce jour-la.
// C'est la tache du soir (routine Claude, 23 h UTC) qui le trouve et qui
// depose `catalyseurs.json`. Elle ne peut ecrire que sur une branche
// `claude/...` du depot Graphe (regle des routines : toute autre branche
// est verifiee, et `main` porte des commits signes shadow-bot, donc
// refusee). La page lit donc la branche `claude/catalyseurs` en direct via
// raw.githubusercontent.com (CORS ouvert), et se rabat sur un fichier a la
// racine du site s'il y en a un. Tant que rien n'existe, l'encart reste
// invisible et le graphe est complet sans lui.
var CATA = [
  "https://raw.githubusercontent.com/guillaumequesney-code/Graphe/claude/catalyseurs/catalyseurs.json",
  "../catalyseurs.json"
];
function lire(i) {
  if (i >= CATA.length) return Promise.resolve(null);
  return fetch(CATA[i], {cache: "no-store"})
    .then(function (r) { return r.ok ? r.json() : lire(i + 1); })
    .catch(function () { return lire(i + 1); });
}
lire(0)
  .then(function (j) {
    var c = j && j.titres && j.titres[TICKER];
    if (!c || !c.texte) return;
    var e = document.getElementById("cata");
    var d = c.date ? "<b>" + c.date + "</b> — " : "";
    var a = c.source ? ' <a href="' + c.source + '" rel="noopener">source</a>' : "";
    // textContent puis innerHTML controle : le texte vient d'un fichier
    // qu'on publie soi-meme, mais on n'y injecte pas de balises.
    var span = document.createElement("span");
    span.textContent = c.texte;
    e.innerHTML = d + span.innerHTML + a;
    e.hidden = false;
  })
  .catch(function () {});
</script>
